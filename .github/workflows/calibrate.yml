name: Jev calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calibrate.yml"
      - "docs/calibration-examples.json"
      - "scripts/calibrate.ts"
      - "src/calibration.ts"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:calibration
      - name: Run read-only calibration
        run: node lib/scripts/calibrate.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: decilabel-jev-calibration
          path: calibration-results.json
          if-no-files-found: error
          retention-days: 30
