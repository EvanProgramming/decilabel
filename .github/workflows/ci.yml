name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:calibration
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist/index.js dist/licenses.txt dist/package.json
      - run: node --test smoke/bundle.test.mjs
