name: DeciLabel

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: decilabel-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: EvanProgramming/decilabel@8d7841c9e70ebb0248a9d9328a13e165e1180278
        with:
          provider: typesafe
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          model: typesafe/jev-1.13
          threshold: "0.92"
          max-labels: "3"
