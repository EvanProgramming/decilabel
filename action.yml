name: DeciLabel
author: Evan Gong
description: Add evidence-supported GitHub labels using OpenAI GPT-6 Luna or Decisions models from OpenRouter and TypeSafe.
branding:
  icon: tag
  color: blue
inputs:
  openrouter-api-key:
    description: OpenRouter API key when provider is openrouter.
    required: false
  typesafe-api-key:
    description: TypeSafe API key when provider is typesafe.
    required: false
  openai-api-key:
    description: OpenAI API key when provider is openai.
    required: false
  provider:
    description: Decisions API provider (openrouter, typesafe, or openai).
    required: false
    default: openrouter
  github-token:
    description: Token with issues:write and pull-requests:write.
    required: true
    default: ${{ github.token }}
  model:
    description: OpenRouter model ID, typesafe/jev-1.13 for TypeSafe, or gpt-6-luna for OpenAI.
    required: false
  threshold:
    description: Minimum Noul yes probability or Choice winning-option probability.
    required: false
    default: "0.67"
  max-labels:
    description: Maximum eligible labels present after this run, counting existing eligible labels.
    required: false
    default: "3"
  include-labels:
    description: Optional JSON array of repository label names to consider; [] means all eligible labels.
    required: false
    default: "[]"
  exclude-labels:
    description: JSON array of additional excluded label names.
    required: false
    default: "[]"
  exclusive-groups:
    description: Optional JSON array of disjoint arrays of mutually exclusive label names.
    required: false
    default: "[]"
  dry-run:
    description: Classify and report without adding labels.
    required: false
    default: "false"
outputs:
  selected-labels:
    description: JSON array of labels selected by policy.
  added-labels:
    description: JSON array of labels actually added by this run.
  results:
    description: JSON array of probabilities, confidence where available, warnings, and reasons.
  status:
    description: completed, dry-run, skipped, or failed.
  skip-reason:
    description: Reason classification or writes were skipped, if applicable.
runs:
  using: node24
  main: dist/index.js
