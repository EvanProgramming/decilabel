name: DeciLabel
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  issues: write
  pull-requests: write
concurrency:
  group: decilabel-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: EvanProgramming/decilabel@v1.1.0
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: microsoft/microsoft-decision-1
          threshold: "0.80"
          max-labels: "4"
          include-labels: '["bug", "feature", "documentation", "question"]'
          exclude-labels: '["security-sensitive"]'
          exclusive-groups: '[["bug", "feature", "documentation", "question"]]'
          dry-run: "true"
